[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "milestone"
version = "0.1.0"
description = "AI-powered restaurant recommendation system"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
  "python-dotenv>=1.0,<2.0",
  "datasets>=2.14,<4.0",
  "huggingface_hub>=0.20,<1.0",
  "streamlit>=1.28,<2.0",
  "groq>=0.9,<1.0",
  "fastapi>=0.100,<1.0",
  "uvicorn[standard]>=0.23,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
